---
# name: Web Server Update
# description: Configure and update the web server fleet
#
# Safe for repeated runs - only touches /tmp/ansible-gui-demo.
- name: Configure and update the web server fleet
  hosts: local
  gather_facts: false
  vars:
    demo_dir: /tmp/ansible-gui-demo/config

  tasks:
    - name: Ensure demo config directory exists
      file:
        path: "{{ demo_dir }}"
        state: directory
        mode: "0755"

    - name: Render demo nginx config
      copy:
        dest: "{{ demo_dir }}/nginx.conf"
        content: |
          # demo config, generated by webservers.yml
          server {
            listen 80;
            server_name demo.local;
          }

    - name: Validate demo nginx config
      command: nginx -t -c {{ demo_dir }}/nginx.conf
      register: nginx_check
      changed_when: false
      failed_when: false

    - name: Report validation result
      debug:
        msg: >-
          {{ 'nginx binary not available, skipping real validation (demo only)'
             if nginx_check.rc is undefined or nginx_check.rc != 0
             else 'nginx config syntax OK' }}

    - name: Simulate reloading the web server
      command: "true"
      changed_when: true
