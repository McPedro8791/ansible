---
# name: Secret input demo
# description: A password typed into the form - sent privately, never stored, hidden in the log
# param: sudo_password | label=Password | type=secret | required | help=Used for this run only
# param: user | label=User | default=demo | help=Who the password belongs to
#
# type=secret shows a password field. The value reaches the target in a private file (mode 0600, removed after the run), the run list
# shows ********, and the log hides it (from 6 characters on). Still put no_log: true on tasks that use it. A playbook with a secret
# parameter cannot be put in a schedule or a template, and "Repeat" asks for the password again.
- name: Use a secret without leaking it
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: Pretend to log in (the secret goes through the environment, not the command line)
      ansible.builtin.shell: test -n "$DEMO_PASSWORD"
      environment:
        DEMO_PASSWORD: "{{ sudo_password }}"
      changed_when: false
      check_mode: false
      no_log: true

    - name: Report
      ansible.builtin.debug:
        msg: "logged in as {{ user }} (the password is {{ sudo_password | length }} characters long)"
      no_log: true # the length is not secret, but this shows the habit
