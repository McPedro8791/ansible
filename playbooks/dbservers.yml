---
# name: Database Maintenance
# description: Database server maintenance
#
# Safe for repeated runs - only touches /tmp/ansible-gui-demo.
- name: Database server maintenance
  hosts: local
  gather_facts: false
  vars:
    demo_dir: /tmp/ansible-gui-demo/db

  tasks:
    - name: Ensure demo db directory exists
      file:
        path: "{{ demo_dir }}"
        state: directory
        mode: "0755"

    - name: Simulate checking database connectivity
      command: "true"
      changed_when: false

    - name: Simulate running VACUUM
      command: "true"
      changed_when: true

    - name: Write maintenance record
      copy:
        dest: "{{ demo_dir }}/last-maintenance.txt"
        content: "dbservers.yml maintenance run at {{ lookup('pipe', 'date -u +%Y-%m-%dT%H:%M:%SZ') }}\n"

    - name: Report completion
      debug:
        msg: "Database maintenance complete."
