---
# name: Kubernetes Version Demo
# description: Shows the installed Kubernetes version as read-only parameters and checks a target version; changes nothing
# param: current | label=Installed version | type=k8sversion | help=Read from the selected cluster
# param: current_minor | label=Installed minor | type=k8sversion | format=minor
# param: target | label=Target minor version | type=select | options=1.34,1.35,1.36,1.37 | required | help=Must not be older than the installed minor version
#
# Example for `type=k8sversion` parameters (see docs/API.md, "Parameters"):
# they are not entered - the Headlamp plugin reads the Kubernetes version of
# the selected cluster (or, with CONST_VALUES=backend, the backend reads the
# version of the cluster it runs in) and hands it to the playbook. `format`
# is `version` (1.36.1, default), `git` (v1.36.1) or `minor` (1.36).
- name: Compare the installed and the target version
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: Show the versions
      ansible.builtin.debug:
        msg:
          - "installed      = {{ current }}"
          - "installed minor = {{ current_minor }}"
          - "target minor    = {{ target }}"

    - name: Refuse a downgrade
      ansible.builtin.fail:
        msg: "Target {{ target }} is older than the installed {{ current_minor }}."
      when: target is version(current_minor, '<')

    - name: Say what would happen
      ansible.builtin.debug:
        msg: >-
          {{ 'Already on ' ~ target if target == current_minor
             else 'Would upgrade from ' ~ current_minor ~ ' to ' ~ target }}
